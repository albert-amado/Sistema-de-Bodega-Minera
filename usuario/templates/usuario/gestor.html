{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-5">
      <div class="card shadow-sm border-0 rounded-4">
        <div class="card-header bg-primary text-white py-3 rounded-top-4">
          <h5 class="mb-0 fw-bold text-center"><i class="bi bi-person-plus-fill me-2"></i>Registrar Gestor</h5>
        </div>
        <div class="card-body p-4">
          {% if mensaje %}
          <div class="alert alert-info d-flex align-items-center gap-2 mb-3">
            <i class="bi bi-info-circle-fill"></i>
            <div>{{ mensaje }}</div>
          </div>
          {% endif %}

          <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
              {{ form.as_p }}
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Guardar Gestor</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
