{% load static %}

<link rel="stylesheet" href="{% static 'css/accessibility.css' %}">

<div id="a11y-widget">
  <button id="a11y-fab" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="a11y-dock" aria-label="Abrir herramientas de accesibilidad">
    <i class="bi bi-universal-access-circle" style="font-size: 26px;" aria-hidden="true"></i>
  </button>

  <div id="a11y-dock" role="menu" aria-label="Herramientas de accesibilidad" hidden>
    <div class="a11y-grid">
      <button class="a11y-item" type="button" role="menuitemcheckbox" aria-checked="false" data-toggle="grayscale">
        <span class="ico" aria-hidden="true">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><line x1="12" y1="3" x2="12" y2="21"/></svg>
        </span>
        <span class="a11y-label">Grises</span>
      </button>

      <button class="a11y-item" type="button" role="menuitemcheckbox" aria-checked="false" data-toggle="invert">
        <span class="ico" aria-hidden="true">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 010 18z" fill="currentColor" stroke="none"/></svg>
        </span>
        <span class="a11y-label">Modo oscuro</span>
      </button>

      <button class="a11y-item" type="button" role="menuitemcheckbox" aria-checked="false" data-toggle="links">
        <span class="ico" aria-hidden="true">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15l4-8 4 8M6 12h4M20 15c0 2-1.5 3-3 3s-3-1-3-3 1.5-3 3-3 3 1 3 3z"/></svg>
        </span>
        <span class="a11y-label">Enlaces</span>
      </button>

      <button class="a11y-item" type="button" role="menuitemcheckbox" aria-checked="false" data-toggle="saturate">
        <span class="ico" aria-hidden="true">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4.5"/></svg>
        </span>
        <span class="a11y-label">Saturación</span>
      </button>
    </div>

    <div class="a11y-slider-row">
      <label for="a11y-fontsize">Tamaño de texto</label>
      <input type="range" id="a11y-fontsize" min="80" max="200" step="5" value="100">
      <output for="a11y-fontsize">100%</output>
    </div>

    <div class="a11y-slider-row">
      <label for="a11y-lineheight">Interlineado</label>
      <input type="range" id="a11y-lineheight" min="10" max="30" step="1" value="15">
      <output for="a11y-lineheight">1.5</output>
    </div>

    <div class="a11y-bottom">
      <button id="a11y-reset" type="button">Restablecer</button>
      <button id="a11y-close" type="button">Cerrar</button>
    </div>
  </div>
</div>

<script src="{% static 'js/accesibilidad.js' %}" defer></script>
