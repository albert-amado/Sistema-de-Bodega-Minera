<!-- Modal Global Reutilizable para Ver Detalles (Sistema de Bodega Minera) -->
<div class="modal fade" id="modalSBMDetalle" tabindex="-1" aria-labelledby="modalSBMDetalleLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
    <div class="modal-content border-0 shadow-lg" style="border-radius: 14px; overflow: hidden;">
      
      <!-- CABECERA MODAL CON PALETA SBM -->
      <div class="modal-header text-white p-3 p-md-4" style="background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%); border-bottom: 3px solid #F59E0B;">
        <div class="d-flex align-items-center gap-3">
          <div id="sbmDetalleAvatar" class="d-flex align-items-center justify-content-center rounded-circle fw-bold shadow-xs flex-shrink-0"
               style="width: 44px; height: 44px; background: #F59E0B; color: #0F172A; font-size: 1.1rem;">
            <i class="bi bi-info-circle-fill"></i>
          </div>
          <div>
            <span id="sbmDetalleBadge" class="badge mb-1" style="background: rgba(245, 158, 11, 0.2); color: #FCD34D; border: 1px solid rgba(245, 158, 11, 0.4); font-size: 0.72rem;">
              DETALLES DEL REGISTRO
            </span>
            <h5 class="modal-title fw-bold text-white mb-0" id="modalSBMDetalleLabel">
              Ficha de Información
            </h5>
            <div id="sbmDetalleSubtitulo" class="small text-muted font-monospace" style="color: #94A3B8 !important;">
              Sistema de Bodega Minera
            </div>
          </div>
        </div>
        <button type="button" class="btn-close btn-close-white ms-auto shadow-none" data-bs-dismiss="modal" aria-label="Cerrar ventana de detalles"></button>
      </div>

      <!-- CUERPO DEL MODAL (CAMPOS DINÁMICOS) -->
      <div class="modal-body p-3 p-md-4 bg-light">
        <div id="sbmDetalleGrid" class="row g-3">
          <!-- Se llena dinámicamente con JavaScript -->
        </div>

        <div id="sbmDetalleExtra" class="mt-3 d-none">
          <!-- Contenido adicional opcional (listado de herramientas de un préstamo, etc.) -->
        </div>
      </div>

      <!-- PIE DEL MODAL -->
      <div class="modal-footer bg-white border-top p-3 d-flex justify-content-between align-items-center">
        <button type="button" id="btnCopiarDetallesModal" class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-1 shadow-xs">
          <i class="bi bi-clipboard"></i> Copiar Ficha
        </button>
        <div class="d-flex gap-2">
          <button type="button" class="btn btn-secondary btn-sm px-3 shadow-xs" data-bs-dismiss="modal">
            Cerrar
          </button>
        </div>
      </div>

    </div>
  </div>
</div>
